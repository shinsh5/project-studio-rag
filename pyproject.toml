[project]
name = "project-studio-rag"
version = "0.1.0"
description = "Standalone ROI-RAG inference API and web interface"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "numpy<2.0.0",
    "faiss-cpu",
    "sentence-transformers",
    "python-dotenv",
    "jinja2",
    "python-multipart",
    "pydantic",
    "ollama",
    "ragas (==0.3.9)",
    "datasets",
    "langchain-community (==0.3.31)",
    "google-genai",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
